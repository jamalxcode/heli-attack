<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Heli Attack</title>
<meta name="description" content="Heli Attack: a modern take on the 1981 arcade cave shooter. Fly, shoot, bomb, refuel and grab the data core. Plays on laptop and phone.">
<meta name="theme-color" content="#05060f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="Heli Attack">
<meta property="og:description" content="Retro side-scrolling helicopter shooter in your browser.">
<meta property="og:url" content="https://heliattack.sala.company/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2305060f'/%3E%3Crect x='8' y='14' width='48' height='4' rx='2' fill='%23cfe8ff'/%3E%3Crect x='30' y='16' width='4' height='8' fill='%23456'/%3E%3Cellipse cx='34' cy='34' rx='16' ry='10' fill='%232a9be0'/%3E%3Cellipse cx='42' cy='31' rx='6' ry='5' fill='%23c8faff'/%3E%3Crect x='6' y='31' width='16' height='4' fill='%231e6fa8'/%3E%3Cpath d='M20 48h26' stroke='%239fb3c8' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; outline: none; }
  noscript { color: #fff; font: 16px sans-serif; position: absolute; top: 40%; width: 100%; text-align: center; }
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Heli Attack game"></canvas>
<noscript>Heli Attack needs JavaScript to run.</noscript>
<script src="game.js"></script>
<!-- GoatCounter analytics (not loaded on localhost; paths are prefixed with the host so all *.sala.company apps share one dashboard) -->
<script>
  (function () {
    if (/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
    window.goatcounter = { endpoint: 'https://salacompany.goatcounter.com/count', path: function (p) { return location.host + p; } };
    var s = document.createElement('script');
    s.async = true;
    s.src = 'https://gc.zgo.at/count.js';
    s.setAttribute('data-goatcounter', 'https://salacompany.goatcounter.com/count');
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
